<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Wiretap social preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f12"/>
      <stop offset="100%" stop-color="#121a1e"/>
    </linearGradient>
    <linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#148f8a"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#148f8a"/>
  <!-- large signal -->
  <path d="M80 360 H280 C360 360 400 180 520 180 S680 480 800 480 S920 280 1200 280"
