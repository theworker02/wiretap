  <circle cx="800" cy="480" r="14" fill="#d4a373"/>
  <path d="M800 494 V540" stroke="#d4a373" stroke-width="6" stroke-linecap="round"/>
  <!-- copy -->
  <text x="80" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
