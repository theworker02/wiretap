name: fuzz

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Short fuzz (CI budget)
        run: |
          go test ./internal/capture -fuzz=FuzzParseHex -fuzztime=250000x
          go test ./internal/inference -fuzz=FuzzChecksum -fuzztime=250000x
          go test ./schema -fuzz=FuzzSchemaYAML -fuzztime=250000x
